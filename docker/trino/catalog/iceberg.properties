# Trino Iceberg connector pointed at the same REST catalog and the same MinIO
# warehouse that s3_event_consumer writes to.
#
# The credentials here are the throwaway local MinIO defaults from
# docker-compose.yml. Against VAST S3, replace the s3.* values and keep this
# file out of version control.

connector.name=iceberg

iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://warehouse/

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
