# Supporting services for the VAST S3 -> Apache Iceberg customer demo.
#
#   docker compose -f docker/docker-compose.yml up -d --wait
#
# Three containers, all stateless with respect to your data:
#
#   iceberg-rest  Apache Iceberg REST catalog. Tracks which metadata file is
#                 the current version of each table. Reads and writes that
#                 metadata on VAST S3.
#   trino         SQL query engine. Reads the same catalog and the same VAST S3
#                 warehouse the consumer writes to.
#   sqlpad        Browser SQL UI, pre-wired to Trino. The customer-facing view.
#
# WHAT IS NOT HERE, AND WHY
# The object store and the event broker are VAST. They are not containers.
# The Iceberg table's Parquet data files and metadata live in a VAST S3 bucket,
# and Kafka events come from the VAST Kafka-compatible Event Broker. This file
# only provides the catalog and the query layer.
#
# CONFIGURATION
# Every VAST-specific value comes from the environment - nothing is hardcoded.
# Populate them from your own untracked env file before starting:
#
#   set -a; . ./demo.env; set +a
#   docker compose -f docker/docker-compose.yml up -d --wait
#
# See docker/demo.env.example for the full list and format.
#
# SECRETS
# VAST_S3_ACCESS_KEY and VAST_S3_SECRET_KEY are read from the environment and
# are never written into this file. Keep demo.env out of version control - it
# is git-ignored.

name: vast-iceberg-demo

services:
  # ------------------------------------------------------------------ #
  # Apache Iceberg REST catalog, backed by VAST S3.
  #
  # Table metadata pointers are kept in a SQLite file on a named volume so the
  # catalog survives a container restart; the table metadata and data files
  # themselves live in the VAST S3 warehouse bucket.
  # ------------------------------------------------------------------ #
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    container_name: vast-iceberg-rest
    # The image runs as uid 1000 (iceberg); a fresh named volume is root-owned,
    # so the catalog-init service below hands the directory over first.
    user: "1000:1000"
    depends_on:
      catalog-init:
        condition: service_completed_successfully
    environment:
      # Credentials for the Iceberg S3FileIO client that reads and writes the
      # warehouse. Supplied from the environment, never stored in this file.
      AWS_ACCESS_KEY_ID: ${VAST_S3_ACCESS_KEY:?VAST_S3_ACCESS_KEY is not set - see docker/demo.env.example}
      AWS_SECRET_ACCESS_KEY: ${VAST_S3_SECRET_KEY:?VAST_S3_SECRET_KEY is not set - see docker/demo.env.example}
      AWS_REGION: ${VAST_S3_REGION:-us-east-1}

      CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE:?ICEBERG_WAREHOUSE is not set - e.g. s3://iceberg-warehouse/}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: ${VAST_S3_ENDPOINT:?VAST_S3_ENDPOINT is not set - e.g. https://s3.vast.example.com}
      # VAST S3 addresses buckets by path, not by DNS subdomain. Virtual-host
      # style would resolve bucket.s3.your-vast.example, which does not exist.
      CATALOG_S3_PATH__STYLE__ACCESS: "true"

      # JDBC catalog backend. A file rather than :memory: so snapshot history -
      # and therefore the time-travel part of the demo - survives a restart.
      CATALOG_URI: jdbc:sqlite:file:/catalog/catalog.db
      CATALOG_JDBC_SCHEMA__VERSION: V1
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8181:8181"
    volumes:
      - catalog-db:/catalog
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8181/v1/config"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # One-shot: makes the catalog volume writable by the REST catalog's
  # unprivileged user, then exits. Runs as root purely to do that chown.
  # ------------------------------------------------------------------ #
  catalog-init:
    image: busybox:1.36
    container_name: vast-iceberg-catalog-init
    command: sh -c "mkdir -p /catalog && chown -R 1000:1000 /catalog && echo 'catalog volume ready'"
    volumes:
      - catalog-db:/catalog
    restart: "no"

  # ------------------------------------------------------------------ #
  # Trino. Reads the same REST catalog and the same VAST S3 warehouse the
  # consumer writes to. Trino is a container in this demo environment only -
  # it is never a dependency of the Python consumer.
  #
  # Version pinned deliberately: 'latest' has changed behaviour under this
  # configuration before. Change it only after re-running scripts/smoke_test.sh.
  #
  # Its own web UI (:8080/ui/) is a cluster and query monitoring dashboard with
  # no SQL editor - the editor is the sqlpad container below.
  # ------------------------------------------------------------------ #
  trino:
    image: trinodb/trino:435
    container_name: vast-iceberg-trino
    depends_on:
      iceberg-rest:
        condition: service_healthy
    environment:
      ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI:-http://iceberg-rest:8181}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      VAST_S3_ENDPOINT: ${VAST_S3_ENDPOINT}
      VAST_S3_REGION: ${VAST_S3_REGION:-us-east-1}
      VAST_S3_ACCESS_KEY: ${VAST_S3_ACCESS_KEY}
      VAST_S3_SECRET_KEY: ${VAST_S3_SECRET_KEY}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      # The catalog properties file is a template: entrypoint.sh expands the
      # ${...} references above into /etc/trino/catalog before Trino starts, so
      # no VAST endpoint or credential is ever baked into an image or a file.
      - ./trino/iceberg.properties.template:/templates/iceberg.properties.template:ro
      - ./trino/entrypoint.sh:/templates/entrypoint.sh:ro
    entrypoint: ["/templates/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 20s
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Browser SQL UI - the primary customer-facing SQL interface.
  #
  # Pre-seeded with the Trino connection through environment variables, and
  # with authentication switched off, so opening it puts you straight into a
  # query editor against the right catalog: no login, no setup wizard, no JDBC
  # driver download. SQLPad bundles a native Trino driver.
  # ------------------------------------------------------------------ #
  sqlpad:
    image: sqlpad/sqlpad:7.5.7
    container_name: vast-iceberg-sqlpad
    depends_on:
      trino:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    environment:
      SQLPAD_PORT: 3000
      # The demo binds to the loopback interface by default, where there is no
      # one to authenticate. If you set BIND_ADDRESS to a routable address so a
      # customer can reach the UI, turn authentication back on first.
      SQLPAD_AUTH_DISABLED: "true"
      SQLPAD_AUTH_DISABLED_DEFAULT_ROLE: admin
      SQLPAD_APP_LOG_LEVEL: warn
      SQLPAD_WEB_LOG_LEVEL: warn
      SQLPAD_QUERY_RESULT_MAX_ROWS: "10000"
      SQLPAD_CONNECTIONS__vast__name: VAST S3 - Apache Iceberg
      SQLPAD_CONNECTIONS__vast__driver: trino
      SQLPAD_CONNECTIONS__vast__host: trino
      SQLPAD_CONNECTIONS__vast__port: "8080"
      SQLPAD_CONNECTIONS__vast__username: sqlpad
      SQLPAD_CONNECTIONS__vast__catalog: iceberg
      SQLPAD_CONNECTIONS__vast__schema: ${ICEBERG_NAMESPACE:-s3_events}
    volumes:
      - sqlpad-data:/var/lib/sqlpad
    restart: unless-stopped

volumes:
  catalog-db:
  sqlpad-data:
