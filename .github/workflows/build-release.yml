name: Build standalone executables

# Manual runs produce downloadable artifacts. Pushing a v* tag additionally
# publishes the archives to a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYINSTALLER_VERSION: "6.22.2"

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    # Built inside AlmaLinux 8 (glibc 2.28, RHEL 8 ABI) rather than on the runner
    # itself. A PyInstaller executable needs the glibc it was built against or
    # newer, and ubuntu-latest would raise that floor to glibc 2.39 - excluding
    # RHEL 8/9, Debian 11/12 and Ubuntu 20.04/22.04.
    #
    # Note this is NOT a manylinux image: those ship a statically-built CPython
    # with Py_ENABLE_SHARED=0 and no libpython*.so, which PyInstaller rejects. The
    # AlmaLinux python3.12 package is built with --enable-shared and provides
    # /usr/lib64/libpython3.12.so.1.0, which is what PyInstaller needs to bundle.
    container: almalinux:8
    steps:
      # Runs before checkout: the base image has neither git nor Python 3.12.
      - name: Install build prerequisites
        run: dnf -y install git tar gzip binutils python3.12 python3.12-pip

      - uses: actions/checkout@v7

      - name: Build
        run: |
          python3.12 -m pip install --upgrade pip
          python3.12 -m pip install -r requirements.txt "pyinstaller==${PYINSTALLER_VERSION}"
          python3.12 -m PyInstaller --onefile --name s3_event_consumer --clean --noconfirm s3_event_consumer.py

      - name: Smoke test
        run: |
          ./dist/s3_event_consumer --help
          # Must exit 1 and name the unedited placeholders.
          ! ./dist/s3_event_consumer --config s3_consumer_config.example.json
          # Informational only - never fail the build on this.
          echo "highest glibc symbol required:"
          objdump -T ./dist/s3_event_consumer 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1 || true

      - name: Stage archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"
          mkdir -p stage
          cp dist/s3_event_consumer s3_consumer_config.example.json stage/
          tar -czf "s3_event_consumer-${VERSION}-linux-x86_64.tar.gz" -C stage .

      - uses: actions/upload-artifact@v7
        with:
          name: s3_event_consumer-linux-x86_64
          path: s3_event_consumer-*-linux-x86_64.tar.gz
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64
    # macos-14 and newer are Apple Silicon. Built natively — never cross-compiled.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller==${PYINSTALLER_VERSION}"
          pyinstaller --onefile --name s3_event_consumer --clean --noconfirm s3_event_consumer.py

      - name: Smoke test
        run: |
          ./dist/s3_event_consumer --help
          ! ./dist/s3_event_consumer --config s3_consumer_config.example.json
          file ./dist/s3_event_consumer

      - name: Stage archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"
          mkdir -p stage
          cp dist/s3_event_consumer s3_consumer_config.example.json stage/
          tar -czf "s3_event_consumer-${VERSION}-macos-arm64.tar.gz" -C stage .

      - uses: actions/upload-artifact@v7
        with:
          name: s3_event_consumer-macos-arm64
          path: s3_event_consumer-*-macos-arm64.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    # Tags only. Manual runs stop after producing artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x86_64, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and attach archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Standalone builds of the VAST S3 event notification demo consumer.
          No Python installation is required to run them.

          | Platform | Download |
          | --- | --- |
          | Linux x86_64 (glibc 2.28+) | `*-linux-x86_64.tar.gz` |
          | macOS Apple Silicon | `*-macos-arm64.tar.gz` |

          ```bash
          tar -xzf s3_event_consumer-*-<platform>.tar.gz
          cp s3_consumer_config.example.json s3_consumer_config.json
          # edit s3_consumer_config.json: broker endpoints, port and topic
          ./s3_event_consumer --config s3_consumer_config.json
          ```

          These executables are **not code-signed or notarised**. On macOS,
          Gatekeeper blocks the first run of a downloaded binary; clear the
          quarantine attribute yourself after verifying the download:

          ```bash
          xattr -d com.apple.quarantine ./s3_event_consumer
          ```

          See the repository README for configuration details and the VAST-side
          deployment guide.
          NOTES
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            artifacts/*.tar.gz
